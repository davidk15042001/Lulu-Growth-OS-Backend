services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lulu_growth_os
      POSTGRES_USER: lulu
      POSTGRES_PASSWORD: lulu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lulu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lulu -d lulu_growth_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lulu_postgres_data:
