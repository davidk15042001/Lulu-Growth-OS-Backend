AWSTemplateFormatVersion: '2010-09-09'
Description: Lulu Growth OS backend pay-as-you-go API on AWS Lambda Function URL.

Parameters:
  ServiceName:
    Type: String
    Default: lulu-growth-os-backend
  ImageUri:
    Type: String
    Description: ECR image URI built from Dockerfile.lambda.
  CorsOrigin:
    Type: String
    Description: Allowed frontend origin for the Lambda Function URL CORS policy.
  FrontendBaseUrl:
    Type: String
    Description: Public frontend base URL.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL-compatible DATABASE_URL. Prefer Aurora DSQL or another serverless public endpoint for true pay-as-you-go.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  KieApiKey:
    Type: String
    NoEcho: true
    Description: Kie.ai API key. Required because AI_PROVIDER defaults to kie in production.
  AwsS3Bucket:
    Type: String
    Default: lulu-growth-os-prod-assets-234371409675-euc1
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
  MemorySize:
    Type: Number
    Default: 1024
    AllowedValues: [512, 1024, 1536, 2048, 3008]
  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 60
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ServiceName}-api
      RetentionInDays: !Ref LogRetentionDays

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ApiLogGroup.Arn}:*
        - PolicyName: private-assets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${AwsS3Bucket}/*

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub ${ServiceName}-api
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt ApiRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          NODE_ENV: production
          PORT: '4000'
          AWS_LWA_PORT: '4000'
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_ASYNC_INIT: 'true'
          RUN_MIGRATIONS_ON_STARTUP: 'false'
          BACKGROUND_WORKERS_ENABLED: 'false'
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_SSL: 'true'
          DATABASE_POOL_MAX: '2'
          JWT_SECRET: !Ref JwtSecret
          KIE_API_KEY: !Ref KieApiKey
          CORS_ORIGIN: !Ref CorsOrigin
          FRONTEND_BASE_URL: !Ref FrontendBaseUrl
          AWS_REGION: !Ref AWS::Region
          AWS_S3_BUCKET: !Ref AwsS3Bucket
          REFRESH_COOKIE_SAME_SITE: none
          TRUST_PROXY: 'true'

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE
      Cors:
        AllowCredentials: true
        AllowHeaders:
          - authorization
          - content-type
          - x-workspace-id
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        AllowOrigins:
          - !Ref CorsOrigin
        MaxAge: 300

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiFunction
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  ApiUrl:
    Description: Public Lambda Function URL for the API.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  ApiFunctionName:
    Value: !Ref ApiFunction
