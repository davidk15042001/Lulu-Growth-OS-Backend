name: Backend bereitstellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: SSH einrichten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//; s/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            if printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519.base64 2>/dev/null \
              && chmod 600 ~/.ssh/id_ed25519.base64 \
              && ssh-keygen -y -f ~/.ssh/id_ed25519.base64 >/dev/null 2>&1; then
              mv ~/.ssh/id_ed25519.base64 ~/.ssh/id_ed25519
            else
              echo 'DEPLOY_SSH_KEY is neither a valid OpenSSH key nor valid base64-encoded key material.'
              exit 1
            fi
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Backend hochladen und starten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude .env \
            --exclude node_modules \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/lulu-growth-os/backend/"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /var/www/lulu-growth-os/backend && npm ci && sudo systemctl restart lulu-growth-backend'
