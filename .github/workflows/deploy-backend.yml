name: Backend bereitstellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:migrations
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

      # Production deployment is performed by the verified combined frontend/backend workflow.
      # Keeping this workflow validation-only prevents a stale repository-specific SSH secret from
      # masking the actual backend test result. The combined workflow uploads and restarts this same
      # backend commit using the working deploy credentials and the restricted sudo wrapper.
