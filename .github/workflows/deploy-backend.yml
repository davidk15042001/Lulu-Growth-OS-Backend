name: Backend bereitstellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Prüfe Backup- und Restore-Skripte
        run: bash -n scripts/backup-database.sh scripts/verify-database-backup.sh
      - name: Prüfe Betriebs-Gates
        run: node --check scripts/verify-backup-policy.mjs scripts/verify-release-gate.mjs
      - run: npm run typecheck
      # The isolated backend checkout has no sibling frontend repository.
      - run: node scripts/architecture-audit.mjs
      - run: npm run test:migrations
      - run: npm run test:schema-contracts
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

      # Production deployment is performed by the verified combined frontend/backend workflow.
      # Keeping this workflow validation-only prevents a stale repository-specific SSH secret from
      # masking the actual backend test result. The combined workflow uploads and restarts this same
      # backend commit using the working deploy credentials and the restricted sudo wrapper.
